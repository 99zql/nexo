<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXO — Feedback de Funcionários</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f2f4f5; --ink-dim:#c7cdd0;
  --up:#6fae8c; --down:#c07a6b;
  --line:rgba(255,255,255,.14);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;background:#050807;color:var(--ink);font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased}
#root{position:relative;min-height:100vh;isolation:isolate}
.bg-scene{position:fixed;inset:0;z-index:0}
.bg-scene img{width:100%;height:100%;object-fit:cover;display:block}
.bg-scene::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.32)}

.page{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:48px 32px 70px;display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}

.heading{flex:0 0 220px;padding-top:6px}
.heading h1{font-size:28px;font-weight:700;line-height:1.2;margin:0 0 8px}
.heading .sub{font-size:14px;color:var(--ink-dim)}

.grid{flex:1;min-width:280px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:820px){.page{flex-direction:column}.grid{grid-template-columns:repeat(2,1fr);width:100%}}
@media (max-width:520px){.grid{grid-template-columns:1fr}}

.card{
  display:flex;flex-direction:column;gap:10px;
  padding:14px;text-decoration:none;color:var(--ink);
  will-change:transform;
  transition:transform .18s ease;
}
.card:hover{transform:translateY(-3px)}
.card:active{transform:translateY(-1px) scale(.99)}

.card .who{display:flex;align-items:center;gap:9px}
.avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12.5px;flex-shrink:0}
.card .name{font-size:13.5px;font-weight:600;margin:0;line-height:1.25}
.card .role{font-size:10.5px;color:var(--ink-dim);margin:1px 0 0}

.pills{display:flex;gap:6px}
.pill{flex:1;height:22px;border-radius:6px;transition:filter .15s ease,transform .15s ease}
.pill.up{background:var(--up)}
.pill.down{background:var(--down)}
.pill:hover{filter:brightness(1.15);transform:scale(1.04)}

.glass-fallback{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}

.logo-wrap{width:100%;display:flex;justify-content:center;margin-top:20px}
.logo-wrap img{height:150px;width:auto;opacity:.95}
@media (max-width:600px){.logo-wrap img{height:90px}}
</style>
</head>
<body>

<div id="root">
  <div class="bg-scene"><img src="assets/bg.jpg" alt="" crossorigin="anonymous"></div>

  <div class="page">
    <div class="heading">
      <h1>Feedback dos Funcionários</h1>
      <div class="sub" id="activeCount">0 ativos</div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="logo-wrap"><img src="assets/logo.png" alt="NEXO"></div>
  </div>
</div>

<script type="module">
import { LiquidGlass } from 'https://cdn.jsdelivr.net/npm/@ybouane/liquidglass/dist/index.js';

const employees = [
  {id:1,name:'Leandro',role:'Atendente — Balcão',up:9,down:2},
  {id:2,name:'James',role:'Suporte técnico N2',up:14,down:1},
  {id:3,name:'Álvaro',role:'Coordenador de entregas',up:5,down:6},
];

const cfg = JSON.stringify({blurAmount:0.3,refraction:0.5,cornerRadius:12,chromAberration:0.03,edgeHighlight:0.06,shadowOpacity:0.3});

function card(e){
  const a = document.createElement('a');
  a.href = `funcionario.html?id=${e.id}`;
  a.className = 'card glass-fallback';
  a.dataset.config = cfg;
  a.innerHTML = `
    <div class="who">
      <div class="avatar">${e.name[0]}</div>
      <div><p class="name">${e.name}</p><p class="role">${e.role}</p></div>
    </div>
    <div class="pills">
      <div class="pill up"></div>
      <div class="pill down"></div>
    </div>`;
  return a;
}

document.getElementById('activeCount').textContent = `${employees.length} ativos`;

const root = document.getElementById('root');
const slots = employees.map(() => document.createElement('div'));
document.getElementById('grid').append(...slots);

const glassEls = employees.map(card);
glassEls.forEach(el => root.appendChild(el));

function place(el, slot){
  const s = slot.getBoundingClientRect();
  const r = root.getBoundingClientRect();
  el.style.position = 'absolute';
  el.style.top = (s.top - r.top + window.scrollY) + 'px';
  el.style.left = (s.left - r.left) + 'px';
  el.style.width = s.width + 'px';
  el.style.zIndex = '2';
}

function sync(){
  glassEls.forEach((el, i) => { slots[i].style.height = el.offsetHeight + 'px'; });
  glassEls.forEach((el, i) => place(el, slots[i]));
}

window.addEventListener('load', async () => {
  sync();
  window.addEventListener('resize', sync);

  try { await document.fonts.ready; } catch(e){}

  try {
    const instance = await LiquidGlass.init({
      root,
      glassElements: glassEls,
      defaults:{blurAmount:0.3,refraction:0.5,cornerRadius:12,fresnel:0.7,shadowOpacity:0.3,shadowSpread:10}
    });
    glassEls.forEach(el => el.classList.remove('glass-fallback'));
    window.addEventListener('resize', () => instance.markChanged());
  } catch(err){
    console.error('LiquidGlass falhou, usando fallback:', err?.message || err);
  }
});
</script>
</body>
</html>
