<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXO — Feedback de Funcionários</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f2f4f5; --ink-dim:#c7cdd0;
  --up:#6fae8c; --down:#c07a6b;
  --line:rgba(255,255,255,.14);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;background:#050807;color:var(--ink);font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased}
#root{position:relative;min-height:100vh;isolation:isolate}

.bg-scene{position:fixed;inset:0;z-index:0}
.bg-scene img{width:100%;height:100%;object-fit:cover;display:block}
.bg-scene::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.32)}

/* .page é o container central: cada seção (título, grid, logo) fica
   empilhada verticalmente, ocupando a largura toda, uma por vez */
.page{
  position:relative;z-index:1;
  max-width:1100px;margin:0 auto;
  padding:56px 32px 60px;
}

.heading{
  margin-bottom:40px; /* respiro entre o título e o grid */
  text-align:left;
}
.heading h1{font-size:30px;font-weight:700;line-height:1.2;margin:0 0 8px}
.heading .sub{font-size:14px;color:var(--ink-dim)}

.divider{
  border:none;
  border-top:1px solid var(--line);
  margin:0 0 40px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:56px; /* respiro entre o grid e a logo */
}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.grid{grid-template-columns:1fr}}

.card{
  display:flex;flex-direction:column;gap:12px;
  padding:16px;text-decoration:none;color:var(--ink);
  will-change:transform;
  transition:transform .18s ease;
}
.card:hover{transform:translateY(-3px)}

.card .who{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0}
.card .name{font-size:14px;font-weight:600;margin:0;line-height:1.25}
.card .role{font-size:11px;color:var(--ink-dim);margin:1px 0 0}

/* pills = indicador de pontos, NÃO é botão — por isso sem cursor de
   clique e sem hover que sugira interação */
.pills{display:flex;gap:6px}
.pill{
  flex:1;height:24px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;
}
.pill.up{background:var(--up);color:#0d1f16}
.pill.down{background:var(--down);color:#2a1512}

.glass-fallback{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}

.logo-wrap{width:100%;display:flex;justify-content:center}
.logo-wrap img{height:120px;width:auto;opacity:.95}
@media (max-width:600px){.logo-wrap img{height:80px}}
</style>
</head>
<body>

<div id="root">
  <div class="bg-scene"><img src="assets/bg.jpg" alt="" crossorigin="anonymous"></div>

  <div class="page">

    <div class="heading">
      <h1>Feedback dos Funcionários</h1>
      <div class="sub" id="activeCount">0 ativos</div>
    </div>

    <hr class="divider">

    <div class="grid" id="grid"></div>

    <div class="logo-wrap"><img src="assets/logo.png" alt="NEXO"></div>

  </div>
</div>

<script type="module">
import { LiquidGlass } from 'https://cdn.jsdelivr.net/npm/@ybouane/liquidglass/dist/index.js';

// empresa de contabilidade — cargos e pontos zerados, prontos pra virem do banco depois
const employees = [
  {id:1,name:'Leandro',role:'Assistente Contábil',up:0,down:0},
  {id:2,name:'James',role:'Analista Fiscal',up:0,down:0},
  {id:3,name:'Álvaro',role:'Contador Responsável',up:0,down:0},
];

const cfg = JSON.stringify({blurAmount:0.3,refraction:0.5,cornerRadius:12,chromAberration:0.03,edgeHighlight:0.06,shadowOpacity:0.3});

function card(e){
  const a = document.createElement('a');
  a.href = `funcionario.html?id=${e.id}`;
  a.className = 'card glass-fallback';
  a.dataset.config = cfg;
  a.innerHTML = `
    <div class="who">
      <div class="avatar">${e.name[0]}</div>
      <div><p class="name">${e.name}</p><p class="role">${e.role}</p></div>
    </div>
    <div class="pills">
      <div class="pill up">${e.up}</div>
      <div class="pill down">${e.down}</div>
    </div>`;
  return a;
}

document.getElementById('activeCount').textContent = `${employees.length} ativos`;

const root = document.getElementById('root');
const slots = employees.map(() => document.createElement('div'));
document.getElementById('grid').append(...slots);

const glassEls = employees.map(card);
glassEls.forEach(el => root.appendChild(el));

function place(el, slot){
  const s = slot.getBoundingClientRect();
  const r = root.getBoundingClientRect();
  el.style.position = 'absolute';
  el.style.top = (s.top - r.top + window.scrollY) + 'px';
  el.style.left = (s.left - r.left) + 'px';
  el.style.width = s.width + 'px';
  el.style.zIndex = '2';
}

function sync(){
  glassEls.forEach((el, i) => { slots[i].style.height = el.offsetHeight + 'px'; });
  glassEls.forEach((el, i) => place(el, slots[i]));
}

window.addEventListener('load', async () => {
  sync();
  window.addEventListener('resize', sync);

  try { await document.fonts.ready; } catch(e){}

  try {
    const instance = await LiquidGlass.init({
      root,
      glassElements: glassEls,
      defaults:{blurAmount:0.3,refraction:0.5,cornerRadius:12,fresnel:0.7,shadowOpacity:0.3,shadowSpread:10}
    });
    glassEls.forEach(el => el.classList.remove('glass-fallback'));
    window.addEventListener('resize', () => instance.markChanged());
  } catch(err){
    console.error('LiquidGlass falhou, usando fallback:', err?.message || err);
  }
});
</script>
</body>
</html>
