<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXO - Feedback de Funcionários</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f2f4f5; --ink-dim:#c7cdd0;
  --up:#6fae8c; --down:#c07a6b;
  --line:rgba(255,255,255,.14);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;background:#050807;color:var(--ink);font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased}
#root{position:relative;min-height:100vh;isolation:isolate}

.bg-scene{position:absolute;inset:0;z-index:0}
.bg-scene img{width:100%;height:100%;object-fit:cover;display:block}
.bg-scene::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.32)}

.page{
  position:relative;z-index:1;
  max-width:1100px;margin:0 auto;
  padding:56px 32px 60px;
}

.heading{
  margin-bottom:40px;
  text-align:left;
}
.heading h1{font-size:30px;font-weight:700;line-height:1.2;margin:0 0 8px}
.heading .sub{font-size:14px;color:var(--ink-dim)}

.divider{
  border:none;
  border-top:1px solid var(--line);
  margin:0 0 40px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:56px;
}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.grid{grid-template-columns:1fr}}

.card{
  display:flex;flex-direction:column;gap:16px;
  padding:20px;text-decoration:none;color:var(--ink);
  will-change:transform;
  transition:transform .22s cubic-bezier(.22,1,.36,1);
}
.card:hover{transform:translateY(-4px) scale(1.035)}
.card:active{transform:translateY(-2px) scale(1.01);transition-duration:.1s}

.card .who{display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex-shrink:0}
.card .name{font-size:15px;font-weight:600;margin:0;line-height:1.25}
.card .role{font-size:11.5px;color:var(--ink-dim);margin:2px 0 0}

.pills{display:flex;gap:8px}
.pill{
  flex:1;padding:8px 10px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:14px;font-weight:700;
}
.pill .icon{font-size:17px;line-height:1}
.pill.up{background:rgba(111,174,140,.16);color:var(--up)}
.pill.down{background:rgba(192,122,107,.16);color:var(--down)}

.glass-fallback{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}

.logo-wrap{width:100%;display:flex;justify-content:center}
.logo-wrap img{height:150px;width:auto;opacity:.95}
@media (max-width:600px){.logo-wrap img{height:80px}}

.state-msg{padding:20px;text-align:center;color:var(--ink-dim);font-size:13.5px;grid-column:1/-1}
.state-msg[data-error="true"]{color:var(--down)}
</style>
</head>
<body>

<div id="root">
  <div class="bg-scene"><img src="assets/bg.jpg" alt="" crossorigin="anonymous"></div>

  <div class="page">

    <div class="heading">
      <h1>Desempenho dos Funcionários</h1>
      <div class="sub" id="activeCount">carregando...</div>
    </div>

    <hr class="divider">

    <div class="grid" id="grid"></div>

    <div class="logo-wrap"><img src="assets/logo.png" alt="NEXO"></div>

  </div>
</div>

<script type="module">
import { LiquidGlass } from 'https://cdn.jsdelivr.net/npm/@ybouane/liquidglass/dist/index.js';

// endereço da API (mesmo backend usado no funcionario.html)
const API_BASE = 'https://nexo-y481.onrender.com';

const cfg = JSON.stringify({blurAmount:0,refraction:0.69,cornerRadius:20,chromAberration:0.05,edgeHighlight:0.05,fresnel:1,shadowOpacity:0.3});

function card(e){
  const a = document.createElement('a');
  a.href = `funcionario.html?id=${e.id}`;
  a.className = 'card glass-fallback';
  a.dataset.config = cfg;
  a.innerHTML = `
    <div class="who">
      <div class="avatar">${e.name[0]}</div>
      <div><p class="name">${e.name}</p><p class="role">${e.role}</p></div>
    </div>
    <div class="pills">
      <div class="pill up"><span class="icon">▲</span>${e.up}</div>
      <div class="pill down"><span class="icon">▼</span>${e.down}</div>
    </div>`;
  return a;
}

function stateMessage(text, isError){
  const el = document.createElement('div');
  el.className = 'state-msg';
  if (isError) el.dataset.error = 'true';
  el.textContent = text;
  return el;
}

const root = document.getElementById('root');
const gridEl = document.getElementById('grid');
const activeCountEl = document.getElementById('activeCount');

async function fetchEmployees(){
  const res = await fetch(`${API_BASE}/employees`);
  if (!res.ok) throw new Error(`API respondeu ${res.status}`);
  return res.json();
}

async function main(){
  // a API no Render pode "dormir" e demorar pra acordar na primeira
  // requisição — por isso o aviso de carregando fica visível até chegar
  // uma resposta (ou erro) de verdade
  activeCountEl.textContent = 'carregando funcionários...';

  let employees;
  try {
    employees = await fetchEmployees();
  } catch (err) {
    console.error('Falha ao buscar funcionários:', err);
    activeCountEl.textContent = 'não foi possível carregar';
    gridEl.appendChild(stateMessage('Não foi possível conectar à API. O servidor pode estar iniciando — tente recarregar em alguns segundos.', true));
    return;
  }

  if (employees.length === 0){
    activeCountEl.textContent = '0 ativos';
    gridEl.appendChild(stateMessage('Nenhum funcionário cadastrado.', false));
    return;
  }

  activeCountEl.textContent = `${employees.length} ativos`;

  const slots = employees.map(() => document.createElement('div'));
  gridEl.append(...slots);

  const glassEls = employees.map(card);
  glassEls.forEach(el => root.appendChild(el));

  function place(el, slot){
    const s = slot.getBoundingClientRect();
    const r = root.getBoundingClientRect();
    el.style.position = 'absolute';
    el.style.top = (s.top - r.top) + 'px';
    el.style.left = (s.left - r.left) + 'px';
    el.style.width = s.width + 'px';
    el.style.zIndex = '2';
  }

  function sync(){
    glassEls.forEach((el, i) => { slots[i].style.height = el.offsetHeight + 'px'; });
    glassEls.forEach((el, i) => place(el, slots[i]));
  }

  sync();
  window.addEventListener('resize', sync);

  try { await document.fonts.ready; } catch(e){}

  try {
    const instance = await LiquidGlass.init({
      root,
      glassElements: glassEls,
      defaults:{blurAmount:0,refraction:0.69,cornerRadius:20,chromAberration:0.05,edgeHighlight:0.05,fresnel:1,shadowOpacity:0.3,shadowSpread:10}
    });
    glassEls.forEach(el => el.classList.remove('glass-fallback'));

    window.addEventListener('resize', () => { sync(); instance.markChanged(); });

    glassEls.forEach(el => {
      el.addEventListener('transitionend', ev => {
        if (ev.propertyName === 'transform') instance.markChanged(el);
      });
    });
  } catch(err){
    console.error('LiquidGlass falhou, usando fallback:', err?.message || err);
  }
}

window.addEventListener('load', main);
</script>
</body>
</html>
